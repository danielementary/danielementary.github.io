baseURL: "https://danielementary.me/"
locale: en-us
title: danielementary
pagination:
  pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: danielementary
  description: "Daniel, brewing specialty coffee and engineering software."
  keywords: [Specialty Coffee, Software Engineering]
  author: Daniel
  images: ["pp.jpeg"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableFingerprinting: true
    favicon: favicon.ico
    favicon16x16: favicon-16x16.png
    favicon32x32: favicon-32x32.png
    apple_touch_icon: apple-touch-icon.png
    # safari_pinned_tab: "<link / abs url>"

  label:
    text: danielementary

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Daniel
    subtitle: "Brewing and Engineering"
    imageUrl: pp.jpeg
    imageWidth: 150
    imageHeight: 150
    imageTitle: Daniel
    # buttons:
    #   - name: Posts
    #     url: posts
    #   - name: Tags
    #     url: tags

  socialIcons:
    - name: github
      url: "https://github.com/danielementary"
    - name: x
      url: "https://x.com/danielementary"
    - name: telegram
      url: "https://t.me/danielementary"
    - name: instagram
      url: "https://instagram.com/thewhiteflat.coffee"
    - name: email
      url: "mailto:mail@danielementary.me"
    - name: pgp
      url: /0x9EF76A58.asc

  # cover:
  #   hidden: true # hide everywhere but not in structured data
  #   hiddenInList: true # hide on list pages and home
  #   hiddenInSingle: true # hide on single page

  # editPost:
  #   URL: "https://github.com/danielementary/danielementary.github.io/tree/main/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

# menu:
#   main:
#     - identifier: tags
#       name: tags
#       url: /tags/
#       weight: 10

# https://gohugo.io/host-and-deploy/host-on-github-pages/
caches:
  images:
    dir: :cacheDir/images

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
markup:
  highlight:
    noClasses: false
